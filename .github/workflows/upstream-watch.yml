name: Watch canonical upstream

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check PietJankbal upstream
        run: |
          git remote add canonical-upstream https://github.com/PietJankbal/Chocolatey-for-wine.git
          git fetch --no-tags canonical-upstream main
          # The script evaluates the HEAD..canonical-upstream/main range.
          .github/scripts/check-upstream-drift.sh HEAD canonical-upstream/main
